name: Generate Contribution Snake

# Reads the real contribution graph for the repository owner and renders it as
# an animated snake. Nothing is written back to the contribution graph itself —
# this only visualises what is already there.

on:
  # Rebuild once a day so the snake keeps up with new contributions.
  schedule:
    - cron: "0 0 * * *"
  # Allow running it by hand from the Actions tab.
  workflow_dispatch:
  # Regenerate immediately when this workflow changes.
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-latest

    # The built-in GITHUB_TOKEN needs write access to push the output branch.
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
