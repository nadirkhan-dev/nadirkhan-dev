name: Generate Contribution Snake

# Reads the real contribution graph for the repository owner and renders it as
# an animated snake. Nothing is written back to the contribution graph itself —
# this only visualises what is already there.

on:
  # Rebuild once a day so the snake keeps up with new contributions.
  schedule:
    - cron: "0 0 * * *"
  # Allow running it by hand from the Actions tab.
  workflow_dispatch:
  # Regenerate immediately when this workflow changes.
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-latest

    # The built-in GITHUB_TOKEN needs write access to push the output branch.
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake coloured to match the contribution graph itself: the darkest
          # green of each palette, so it reads as part of the graph rather than
          # as a foreign object crossing it.
          outputs: |
            dist/snake.svg?color_snake=#216e39&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?palette=github-dark&color_snake=#39d353
            dist/snake.gif?color_snake=#216e39&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
